# Container-network variant of the local runnable preset. "Lot 8 —
# Compose et configuration locale" (an external plan's own numbering, not
# this repo's own docs/refactoring-plan.md Lot sequence — do not conflate
# the two): extends this file with a Postgres-backed audit_sink so
# compose.yaml's `postgres` service is genuinely exercised, not left idle.
#
# Deliberately NOT `auto_migrate: true` here: `PostgresAuditSink.check_health()`
# always uses its own separate, dedicated connection (ADR-0010), never the
# pool `auto_migrate` lazily migrates through on first `record()` — so
# `auto_migrate` alone would leave `/ready` reporting "schema not migrated"
# indefinitely until some real audit write happened to occur first. Schema
# setup is instead a real, observable one-shot step: compose.yaml's
# `migrate` service runs `mrag db migrate` before `api` ever starts,
# matching ADR-0011's own production posture rather than inventing a
# separate local-only schema-creation mechanism.
version: "1.0"
id: docker-local-hybrid-rag
description: "Local Docker Compose pipeline using the qdrant/postgres service hostnames."
tenant: default
environment: dev

chunker:
  type: adaptive
  config:
    chunk_size: 512
    chunk_overlap: 64

embedder:
  type: sentence-transformers
  config:
    model: "BAAI/bge-small-en-v1.5"

indexer:
  type: qdrant
  config:
    collection: documents
    url: "http://qdrant:6333"

retriever:
  type: hybrid
  config:
    vector_weight: 0.7
    bm25_weight: 0.3
    k: 20
    reranker_k: 5

reranker:
  type: cross-encoder
  config:
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

generator:
  type: openai
  config:
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 2048

governance:
  audit_sink:
    type: postgres
    config:
      dsn: "secret://AUDIT_DATABASE_URL"
