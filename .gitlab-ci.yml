image: python:3.11-slim

stages:
  - lint
  - test
  - coverage

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install -e .[dev] || pip install -e .
  # ruff is included in dev dependencies; no need to install separately

lint:
  stage: lint
  script:
    - echo "✓ Linting with ruff (syntax, imports, naming)..."
    - ruff check src/modular_rag/ tests/ --select E,F,I,N,W,UP,B,C4 --output-format=concise
    - echo "✓ Type checking with mypy (warnings only, not blocking)..."
    - mypy src/modular_rag/ --no-error-summary || true
  allow_failure: false
  timeout: 10 minutes

test:unit:
  stage: test
  script:
    - echo "Running unit tests (no external services)..."
    - pytest tests/unit/ -v --tb=short
  timeout: 5 minutes

test:contract:
  stage: test
  script:
    - echo "Running contract conformance tests..."
    - pytest tests/contract/ -v --tb=short
  timeout: 5 minutes

coverage:
  stage: coverage
  script:
    - echo "Running all tests with coverage..."
    - pytest tests/unit/ tests/contract/ --cov=src/modular_rag --cov-report=term-missing --cov-report=xml -v
  coverage: '/TOTAL\s+(\d+\%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  timeout: 10 minutes