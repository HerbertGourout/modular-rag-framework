[build-system]
# Pinned (Lot 9, Codex review HIGH-002): a bare "hatchling" let `python -m build`'s
# isolated environment install whatever the newest Hatchling (and its own
# transitives) happened to be at build time -- the built wheel's metadata/layout
# could differ between two builds of the same commit even with every runtime
# dependency locked. Dockerfile's builder stage pins this exact version (plus its
# resolved transitives: packaging, pathspec, pluggy, tomlkit, trove-classifiers)
# and builds with `--no-isolation` instead. Refresh together: `uv pip compile` a
# throwaway `hatchling` requirement for --python-platform linux --python-version
# 3.12, update this pin and the Dockerfile's builder-stage pins from that output.
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "modular-rag"
version = "0.0.1"
description = "A modular framework for production-grade RAG and agentic systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Publicis Data Specialists" }]
keywords = ["rag", "llm", "agents", "retrieval", "knowledge-graph", "agentic-ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Minimal runtime — adapters are optional extras
#
# Lot 9 (external plan; not docs/refactoring-plan.md's own Lot sequence) removed
# two dead entries here, each verified zero-import across src/ + tests/ +
# manifests/ before removal:
#   - pydantic-settings: leftover of app/settings.py's Settings class, deleted in
#     ADR-0007's Étape 8 stabilization pass. docs/architecture/structure.md
#     already documented this dependency as a "leftover... not evidence it's in
#     active use" before pyproject.toml was ever updated to match.
#   - python-ulid: core/ids.py generates ids via stdlib uuid.uuid4(), not ulid;
#     no file anywhere imports the `ulid` package.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
# No "v3" (Graph Memory) group: removed in Lot 17 (docs/refactoring-plan.md). Its four
# dependencies (neo4j, networkx, spacy, python-louvain) had zero imports anywhere in
# src/modular_rag/ — verified before removal — and backed the native GraphRAG
# traversal/community-detection build that ADR-0005 §5.2 delegates to the selected
# external engine instead. See docs/refactoring/lot-17-prototype-retirement.md.
# V1 — Core RAG
v1 = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=3.0",
    "openai>=1.30",
    # Codex review (Lot 6, fourth pass, HIGH-001): raised from >=0.28 —
    # AnthropicGenerator.check_health() calls `client.models.retrieve()`,
    # which needs the SDK's `models` resource. Verified live against the
    # official anthropic-sdk-python tags: absent through v0.50.0, present
    # from v0.51.0 onward (`def models(self)` first appears in
    # src/anthropic/_client.py at that tag). >=0.28 would let
    # `pip install -e ".[v1]"` resolve a version where /ready deterministically
    # 503s with AttributeError, even though `generate()` itself works fine
    # on every one of those older versions (messages.create() predates
    # models.retrieve() by a wide margin).
    "anthropic>=0.51",
    # Codex review (Lot 5, HIGH-002): raised from >=1.9 — QdrantSparseStore
    # (adapters/vectorstores/qdrant_sparse_store.py) uses `Modifier.IDF` and
    # `QdrantClient.query_points()`, neither present in the officially
    # tagged qdrant-client 1.9.0; the unified Query API (query_points) is
    # documented as available from client/server 1.10 onward. requirements-lock.txt
    # already resolves to 1.18.0, which is what this environment's tests
    # actually ran against — this only corrects the declared floor to match.
    "qdrant-client>=1.10",
    "rank-bm25>=0.2",
    # Lot 9 (external plan; not docs/refactoring-plan.md's own Lot sequence) removed
    # "cohere>=5.5" and "langchain-text-splitters>=0.2" from here — both verified
    # zero-import across src/, tests/, and manifests/ (including manifests/blueprints/):
    # no CohereGenerator/CohereReranker/CohereEmbedder class exists anywhere
    # (generation/synthesizers/ only has OpenAIGenerator, AnthropicGenerator,
    # DeterministicGenerator), and every chunker under ingestion/chunkers/ is native
    # (fixed.py, adaptive.py, _windowing.py) — none uses langchain_text_splitters.
    # Unlike the v4/v5 extras below (explicitly documented as "not yet wired into any
    # code — V4/V5 not reached", a deliberate roadmap deferral), these two carried no
    # such flag anywhere despite sitting inside v1, which CLAUDE.md's own roadmap
    # (block 09) already marks implementation-complete — dead weight, not a
    # placeholder for sequenced future work.
    # Opt-in subword token counting for chunkers (token_counter: "tiktoken" in manifests);
    # the default whitespace counter needs no dependency.
    "tiktoken>=0.7",
]
# V4 — Observability / Governance
v4 = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-api>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
]
# V5 — Multimodal
v5 = [
    "pymupdf>=1.24",
    "pillow>=10.3",
    "pytesseract>=0.3",
]
# External engine delegation (ADR-0006, Lot 15) — LangGraphEngineAdapter
# (adapters/llms/langgraph_engine.py). Optional: the native adapter (default)
# needs none of this; only manifests with engine.adapter: "langgraph" do.
langgraph = [
    "langgraph>=1.2",
]
# Durable audit/lifecycle implementations selected by secure-enterprise-rag.yaml.
# ADR-0011 (PostgreSQL migrations, pooling, and retention): "pool" pulls in the
# separate `psycopg-pool` PyPI package (psycopg_pool.ConnectionPool) — verified
# against psycopg's own docs (pip install "psycopg[pool]") before adding, not
# guessed.
postgres = [
    "psycopg[binary,pool]>=3.1",
]
# OIDC/JWKS verification for authenticated API deployments.
auth = [
    "pyjwt[crypto]>=2.8",
]
# Development
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "httpx>=0.27",
    "respx>=0.21",
    "build>=1.2",
]
# Supply-chain evidence (Lot 16b, docs/refactoring-plan.md — "SBOM,
# vulnerability and licence gates"): scripts/check_licenses.py and CI's
# supply-chain job. Not needed to run the framework itself.
supply-chain = [
    "pip-audit>=2.7",
    "pip-licenses>=5.0",
    "cyclonedx-bom>=6.0",
]
all = ["modular-rag[v1,v4,v5,langgraph,postgres,auth,dev]"]

[project.scripts]
mrag = "modular_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/modular_rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires Qdrant on localhost:6333 (deselect with '-m not integration')",
    "e2e: full pipeline against real backing services (Qdrant, plus PostgreSQL for a governed/audited preset) — an LLM API key is only required for an LLM-backed preset; the deterministic secure-preset scenario needs no external key at all (deselect with '-m not e2e')",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["modular_rag"]
