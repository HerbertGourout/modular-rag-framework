[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modular-rag"
version = "0.0.1"
description = "A modular framework for production-grade RAG and agentic systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Publicis Data Specialists" }]
keywords = ["rag", "llm", "agents", "retrieval", "knowledge-graph", "agentic-ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Minimal runtime — adapters are optional extras
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "python-ulid>=2.0",
]

[project.optional-dependencies]
# V1 — Core RAG
v1 = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "langchain-text-splitters>=0.2",
    "sentence-transformers>=3.0",
    "openai>=1.30",
    "anthropic>=0.28",
    "qdrant-client>=1.9",
    "rank-bm25>=0.2",
    "cohere>=5.5",
]
# V3 — Graph Memory
v3 = [
    "neo4j>=5.20",
    "networkx>=3.3",
    "spacy>=3.7",
    "python-louvain>=0.16",
]
# V4 — Observability / Governance
v4 = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-api>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
]
# V5 — Multimodal
v5 = [
    "pymupdf>=1.24",
    "pillow>=10.3",
    "pytesseract>=0.3",
]
# Development
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
    "httpx>=0.27",
    "respx>=0.21",
]
all = ["modular-rag[v1,v3,v4,v5,dev]"]

[project.scripts]
mrag = "modular_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/modular_rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires Qdrant on localhost:6333 (deselect with '-m not integration')",
    "e2e: requires Qdrant + LLM API key (deselect with '-m not e2e')",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["modular_rag"]
