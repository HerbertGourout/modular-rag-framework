# Status: BLUEPRINT — design sketch only, NOT a loadable pipeline manifest. `embedder.type:
# multimodal` is not a registered factory (only "sentence-transformers" and
# "openai-embeddings" are), and VLM execution (modality-specialized agents, vision/table/video
# processing) is delegated to a selected external engine per ADR-0005 §5.2, not built natively —
# the `agents:`/`graph_store:` blocks this file used to carry described a native runtime that
# was never built and is explicitly out of scope now. Multimodal *parsing and citation
# enrichment* (extracting images/tables, attaching timecodes) may remain native if future
# evidence supports it (ADR-0005 §5.2) — that's the only part of this sketch still open, kept
# below via `embedder.type: multimodal` and `modalities` as an illustration of the target shape,
# not a claim that either exists today. Do not pass this file to
# `resolve_manifest()`/`mrag validate` expecting it to succeed.
version: "1.0"
id: multimodal-rag
description: "Multimodal pipeline sketch — text + images + tables ingestion and retrieval, pending native parsing/citation-enrichment evidence."
tenant: default
environment: dev

chunker:
  type: adaptive
  config:
    chunk_size: 512
    chunk_overlap: 64

embedder:
  type: multimodal
  config:
    # Requires V5 extras: colpali or CLIP for image embeddings
    text_model: "BAAI/bge-base-en-v1.5"
    image_model: "openai/clip-vit-base-patch32"

indexer:
  type: qdrant
  config:
    collection: multimodal_docs
    url: "http://localhost:6333"
    # Multiple named vectors per point (text, image, table)
    multi_vector: true

retriever:
  type: hybrid
  config:
    vector_weight: 0.7
    bm25_weight: 0.3
    k: 30
    reranker_k: 10

reranker:
  type: cross-encoder
  config:
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

generator:
  # Vision-language model for multimodal generation
  type: anthropic
  config:
    model: "claude-opus-4-7"
    max_tokens: 4096

modalities:
  - text
  - image
  - table
  - audio
  - video

# NOTE: VLM generation/execution (previously sketched here as native modality-specialized
# agents) is delegated per ADR-0005 §5.2 — the generator above would call out to whichever
# engine is selected, not a native agent graph. Only parsing/citation-enrichment fields are
# kept as an open, undecided sketch (see the file header).
