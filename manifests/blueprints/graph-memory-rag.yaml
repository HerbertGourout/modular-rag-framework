# Status: BLUEPRINT — design sketch only, NOT a loadable pipeline manifest. GraphRAG
# traversal/reasoning is delegated to the selected external engine per ADR-0005 §5.2, and the
# engine selected in ADR-0006 (LangGraph) does not itself provide a graph-memory retrieval mode
# today — there is nothing for `graph_store`/`planner`/`agents` below to activate. A native
# knowledge-graph *data model* exists (`memory/graph/knowledge_graph.py`) but is not wired into
# any retriever. Do not pass this file to `resolve_manifest()`/`mrag validate` expecting it to
# succeed — it predates the V2 schema and uses fields (`graph_store`, `planner`, `agents`,
# `modalities`) that ADR-0007 §5 removes from the active schema entirely. Move this file back to
# `presets/` only once the selected engine (or a native replacement) can actually satisfy it.
version: "1.0"
id: graph-memory-rag
description: "V3 GraphRAG pipeline — knowledge graph extraction, multi-hop reasoning, EvoRAG feedback."
tenant: default
environment: dev

chunker:
  type: adaptive
  config:
    chunk_size: 512
    chunk_overlap: 64

embedder:
  type: sentence-transformers
  config:
    model: "BAAI/bge-base-en-v1.5"

indexer:
  type: qdrant
  config:
    collection: documents
    url: "http://localhost:6333"

retriever:
  type: hybrid
  config:
    vector_weight: 0.6
    bm25_weight: 0.4
    k: 30
    reranker_k: 10

reranker:
  type: cross-encoder
  config:
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

generator:
  type: openai
  config:
    model: "gpt-4o"
    temperature: 0.1
    max_tokens: 4096

# V3 — graph memory
graph_store:
  type: networkx
  config:
    entity_types:
      - Person
      - Organization
      - Product
      - Concept
    relation_types:
      - depends_on
      - causes
      - is_part_of
    community_detection: true
    evo_rag_feedback: true

# V2 — planner for multi-hop
planner:
  type: graph
  config: {}

agents:
  - type: extractor
    config: {}
  - type: retriever
    config: {}
  - type: synthesizer
    config: {}
  - type: validator
    config: {}

modalities:
  - text
