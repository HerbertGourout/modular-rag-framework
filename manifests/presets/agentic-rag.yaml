# Status: BLUEPRINT — `planner` and `agents` are declared but ComponentRegistry.wire() never
# processes either field (checked against orchestration/registry.py); they are silently
# ignored, not an error. This manifest wires only its V1 components today. See
# docs/refactoring-plan.md §2 and manifests/README.md.
version: "1.0"
id: agentic-rag
description: "V2 agentic pipeline — adaptive routing, multi-agent (planner/retriever/synthesizer/validator)."
tenant: default
environment: dev

chunker:
  type: adaptive
  config:
    chunk_size: 512
    chunk_overlap: 64

embedder:
  type: sentence-transformers
  config:
    model: "BAAI/bge-base-en-v1.5"

indexer:
  type: qdrant
  config:
    collection: documents
    url: "http://localhost:6333"

retriever:
  type: hybrid
  config:
    vector_weight: 0.7
    bm25_weight: 0.3
    k: 30
    reranker_k: 10

reranker:
  type: cross-encoder
  config:
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

generator:
  type: openai
  config:
    model: "gpt-4o"
    temperature: 0.1
    max_tokens: 4096

# V2 — agentic components
planner:
  type: adaptive
  config:
    llm_model: "gpt-4o-mini"

agents:
  - type: retriever
    config: {}
  - type: extractor
    config: {}
  - type: synthesizer
    config: {}
  - type: validator
    config:
      min_groundedness: 0.1
  - type: coordinator
    config: {}

security:
  type: basic
  config:
    max_query_length: 4000

modalities:
  - text
