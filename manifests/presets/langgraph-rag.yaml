# Status: RUNNABLE (V2) — renamed from agentic-rag.yaml (Étape 7,
# docs/adr/0007-layer-boundaries-and-control-plane-activation.md). The old `planner`/`agents`
# fields described a native multi-agent runtime that was never built (silently ignored by
# ComponentRegistry.wire() — see docs/refactoring-plan.md §2) and was removed as dead prototype
# code in Lot 17. Multi-step/agentic behavior is delegated to LangGraph via `engine.adapter`
# (contracts/engine.py's DocumentEngine port, ADR-0006) instead of a native agent graph. Select
# this manifest through app/bootstrap.py::load_engine(), which returns a LangGraphEngineAdapter
# wrapping the same V1 components declared below.
version: "2.0"
id: langgraph-rag
description: "Hybrid retrieval pipeline routed through the LangGraph DocumentEngine adapter instead of the native sequential pipeline."
tenant: default
environment: dev

chunker:
  type: adaptive
  config:
    chunk_size: 512
    chunk_overlap: 64

embedder:
  type: sentence-transformers
  config:
    model: "BAAI/bge-base-en-v1.5"

indexer:
  type: qdrant
  config:
    collection: documents
    url: "http://localhost:6333"

retriever:
  type: hybrid
  config:
    vector_weight: 0.7
    bm25_weight: 0.3
    k: 30
    reranker_k: 10

reranker:
  type: cross-encoder
  config:
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

generator:
  type: openai
  config:
    model: "gpt-4o"
    temperature: 0.1
    max_tokens: 4096

security:
  type: basic
  config:
    max_query_length: 4000

engine:
  adapter: langgraph
