# Status: RUNNABLE — only V1 components declared; every `type:` here is registered in
# orchestration/_default_factories.py. Validated in CI (see docs/refactoring-plan.md Lot 5).
version: "1.0"
id: local-hybrid-rag
description: "Local development pipeline — hybrid retrieval (vector + BM25), OpenAI generation."
tenant: default
environment: dev

chunker:
  type: adaptive
  config:
    chunk_size: 512
    chunk_overlap: 64

embedder:
  type: sentence-transformers
  config:
    model: "BAAI/bge-small-en-v1.5"

indexer:
  type: qdrant
  config:
    collection: documents
    url: "http://localhost:6333"

retriever:
  type: hybrid
  config:
    vector_weight: 0.7
    bm25_weight: 0.3
    k: 20
    reranker_k: 5

reranker:
  type: cross-encoder
  config:
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

generator:
  type: openai
  config:
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 2048

modalities:
  - text
