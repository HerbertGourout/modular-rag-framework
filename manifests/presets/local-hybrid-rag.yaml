# Status: RUNNABLE — only V1 components declared; every `type:` here is registered in
# app/default_factories.py. Validated in CI (see docs/refactoring-plan.md Lot 5).
version: "1.0"
id: local-hybrid-rag
description: "Local development pipeline — hybrid retrieval (vector + BM25), OpenAI generation."
tenant: default
environment: dev

chunker:
  type: adaptive
  config:
    chunk_size: 512
    chunk_overlap: 64

embedder:
  type: sentence-transformers
  config:
    model: "BAAI/bge-small-en-v1.5"

indexer:
  type: qdrant
  config:
    collection: documents
    url: "http://localhost:6333"

retriever:
  type: hybrid
  config:
    vector_weight: 0.7
    bm25_weight: 0.3
    k: 20
    reranker_k: 5
    # lexical omitted -> defaults to "bm25-memory" (Lot 5, persistent sparse retrieval):
    # in-memory, single-process, does not survive a restart. Explicitly the
    # development choice for this local preset — a durable/multi-instance
    # deployment must set lexical: sparse-qdrant instead (see
    # manifests/presets/secure-enterprise-rag.yaml).

reranker:
  type: cross-encoder
  config:
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

generator:
  type: openai
  config:
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 2048

# Lot 20 corrective pass (Codex review pass 1, HIGH-001): a manifest wiring a known remote
# provider ("openai" here) with no governance.egress_policy at all is now rejected before
# wire() succeeds (orchestration/registry.py's runtime_manifest_errors()) -- this section is
# therefore required, not optional, for this preset to load. max_classification: restricted
# (the most permissive ceiling) preserves this preset's exact pre-Lot-20 behavior: nothing in
# this codebase sets Document.classification on any real ingestion call path today (it is an
# explicit, caller-supplied field -- see core/models/document.py), so every chunk ingested
# through this preset is unclassified and would otherwise resolve through
# ManifestEgressPolicy's own default_classification ("restricted") and be denied outright.
# Tighten this once real classification data exists for this deployment's content.
governance:
  egress_policy:
    type: manifest
    config:
      providers:
        sentence-transformers: {local: true}
        cross-encoder: {local: true}
        openai: {local: false, max_classification: restricted}
