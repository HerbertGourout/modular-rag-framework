# Status: BLUEPRINT — two real breakages, not just unimplemented V4 scope: (1) `policies:`
# references manifests/policies/no-pii-export.yaml and hr-data-restriction.yaml, neither of
# which exists on disk, and ComponentRegistry.wire() never reads the `policies` field anyway;
# (2) `indexer.config.url: "${QDRANT_URL}"` is never interpolated — load_manifest() does a
# plain yaml.safe_load with no env-var substitution (that's Lot 9 scope), so this literal
# string would be passed to QdrantStore as-is. `security`/`evaluation` types (`basic`/
# `exact-match`) ARE real and would wire correctly. See docs/refactoring-plan.md §2 and
# manifests/README.md.
version: "1.0"
id: secure-enterprise-rag
description: "Enterprise pipeline with security guards, PII redaction, and audit telemetry."
tenant: enterprise
environment: production

chunker:
  type: adaptive
  config:
    chunk_size: 512
    chunk_overlap: 64

embedder:
  type: sentence-transformers
  config:
    model: "BAAI/bge-base-en-v1.5"

indexer:
  type: qdrant
  config:
    collection: enterprise_docs
    url: "${QDRANT_URL}"
    api_key: "${QDRANT_API_KEY}"

retriever:
  type: hybrid
  config:
    vector_weight: 0.6
    bm25_weight: 0.4
    k: 20
    reranker_k: 5

reranker:
  type: cross-encoder
  config:
    model: "cross-encoder/ms-marco-MiniLM-L-12-v2"

generator:
  type: openai
  config:
    model: "gpt-4o"
    temperature: 0.0
    max_tokens: 4096

security:
  type: basic
  config:
    max_query_length: 2000

evaluation:
  type: exact-match

# V4 — policy declarations (loaded from policies/ directory)
policies:
  - policies/no-pii-export.yaml
  - policies/hr-data-restriction.yaml

modalities:
  - text
