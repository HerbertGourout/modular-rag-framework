# Status: RUNNABLE (V2) — converted from the old V4-style BLUEPRINT (Étape 7,
# docs/adr/0007-layer-boundaries-and-control-plane-activation.md). Every `type:` below is
# registered in app/default_factories.py. `${QDRANT_URL}` / `secret://QDRANT_API_KEY` /
# `secret://AUDIT_DATABASE_URL` are resolved by app/config_resolution.py::resolve_manifest()
# (used by `mrag validate`/`mrag ask`/`mrag ingest`) — set the matching environment variables
# before loading this manifest, or `resolve_manifest()` fails closed with a clear
# ConfigurationError rather than passing the literal placeholder string through.
version: "2.0"
id: secure-enterprise-rag
description: "Enterprise pipeline with security guards, PII redaction, tenant isolation, policy enforcement, and durable audit trail."
tenant: enterprise
environment: production

chunker:
  type: adaptive
  config:
    chunk_size: 512
    chunk_overlap: 64

embedder:
  type: sentence-transformers
  config:
    model: "BAAI/bge-base-en-v1.5"

indexer:
  type: qdrant
  config:
    collection: enterprise_docs
    url: "${QDRANT_URL}"
    api_key: "secret://QDRANT_API_KEY"

retriever:
  type: hybrid
  config:
    vector_weight: 0.6
    bm25_weight: 0.4
    k: 20
    reranker_k: 5
    # Lot 5 (persistent sparse retrieval): this is the durable-deployment preset —
    # the lexical leg must survive a restart and stay consistent across
    # replicas, neither of which the default in-memory BM25 provides. Backed
    # by a dedicated Qdrant collection (kept separate from `indexer.config.
    # collection` above — see QdrantSparseStore's module docstring for why).
    lexical: sparse-qdrant
    sparse_collection: enterprise_docs_sparse
    # architecture-reviewer finding (Lot 5): unlike the vector leg (whose
    # VectorRetriever gets its real, indexer.config-derived QdrantStore via
    # ComponentRegistry.wire()'s post-wiring injection, making its own
    # url/api_key constructor args dead for a wired pipeline), the sparse
    # leg's QdrantSparseStore is built directly from *this* config block by
    # app/default_factories.py — omitting these here would silently point it
    # at localhost with no credentials regardless of the real endpoint below.
    url: "${QDRANT_URL}"
    api_key: "secret://QDRANT_API_KEY"

reranker:
  type: cross-encoder
  config:
    model: "cross-encoder/ms-marco-MiniLM-L-12-v2"

generator:
  type: openai
  config:
    model: "gpt-4o"
    temperature: 0.0
    max_tokens: 4096

security:
  type: basic
  config:
    max_query_length: 2000

engine:
  adapter: native

# Replaces the old file-referencing `policies:` list (manifests/policies/no-pii-export.yaml,
# hr-data-restriction.yaml never existed on disk, and ComponentRegistry.wire() never read that
# field regardless). PolicyEngine's factory expects inline Policy objects
# (governance.policy_engine.config.policies), not file paths — see
# app/default_factories.py's "policy_engine"/"inline" registration.
governance:
  tenant_enforcement: true
  tenant_policy:
    type: tenant-isolation
  redactor:
    type: patterns
  policy_engine:
    type: inline
    config:
      policies:
        - name: no-pii-export
          rules:
            - name: deny-pii-export-requests
              condition: "export"
              action: deny
              priority: 10
        - name: hr-data-restriction
          rules:
            - name: deny-hr-restricted-queries
              condition: "hr-restricted"
              action: deny
              priority: 10
  audit_sink:
    type: postgres
    config:
      dsn: "secret://AUDIT_DATABASE_URL"
  # ADR-0014 (Batch 14): durable feedback storage and human review, sharing
  # the same PostgreSQL database as audit_sink above (a separate DSN/role is
  # also fine — see docs/guides/postgres-permissions.md). `allow_purge` is
  # never set here on purpose: the manifest-wired instance the live
  # application uses must never be able to purge — only a CLI-constructed
  # one (`mrag feedback purge`/`mrag review purge --dsn <retention-role-dsn>`)
  # can, per app/default_factories.py's own allow_purge-popping factories.
  feedback_sink:
    type: postgres
    config:
      dsn: "secret://AUDIT_DATABASE_URL"
  review_queue:
    type: postgres-human-review
    config:
      dsn: "secret://AUDIT_DATABASE_URL"
      threshold: 0.7
  # Lot 20 corrective pass (Codex review pass 1, HIGH-001): required, not optional -- a
  # manifest wiring a known remote provider ("openai") with no governance.egress_policy at
  # all is now rejected before wire() succeeds. max_classification: restricted (the most
  # permissive ceiling) preserves this preset's exact pre-Lot-20 behavior: nothing in this
  # codebase sets Document.classification on any real ingestion call path today, so every
  # chunk ingested here is unclassified. This is the natural preset to tighten first once
  # real classification data exists, given its own governance-first positioning -- the other
  # controls above (tenant_enforcement, redactor, policy_engine) do not currently branch on
  # classification either (see docs/architecture/data-classification-policy.md §5).
  egress_policy:
    type: manifest
    config:
      providers:
        sentence-transformers: {local: true}
        cross-encoder: {local: true}
        openai: {local: false, max_classification: restricted}

observability:
  telemetry:
    type: structlog
