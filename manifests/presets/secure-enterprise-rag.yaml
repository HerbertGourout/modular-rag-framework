version: "1.0"
id: secure-enterprise-rag
description: "Enterprise pipeline with security guards, PII redaction, and audit telemetry."
tenant: enterprise
environment: production

chunker:
  type: adaptive
  config:
    chunk_size: 512
    chunk_overlap: 64

embedder:
  type: sentence-transformers
  config:
    model: "BAAI/bge-base-en-v1.5"

indexer:
  type: qdrant
  config:
    collection: enterprise_docs
    url: "${QDRANT_URL}"
    api_key: "${QDRANT_API_KEY}"

retriever:
  type: hybrid
  config:
    vector_weight: 0.6
    bm25_weight: 0.4
    k: 20
    reranker_k: 5

reranker:
  type: cross-encoder
  config:
    model: "cross-encoder/ms-marco-MiniLM-L-12-v2"

generator:
  type: openai
  config:
    model: "gpt-4o"
    temperature: 0.0
    max_tokens: 4096

security:
  type: basic
  config:
    max_query_length: 2000

evaluation:
  type: exact-match

# V4 — policy declarations (loaded from policies/ directory)
policies:
  - policies/no-pii-export.yaml
  - policies/hr-data-restriction.yaml

modalities:
  - text
