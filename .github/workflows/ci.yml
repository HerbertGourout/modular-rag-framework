name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[v1,dev]
      - name: Lint with ruff (syntax, imports, naming)
        run: ruff check . --select E,F,I,N,W,UP,B,C4 --output-format=concise
      - name: Compilation check
        run: python -m compileall -q src/modular_rag scripts examples docker
      - name: Hexagonal layering audit (strict)
        run: python scripts/check_layering.py --strict
      - name: Documentation consistency
        run: python scripts/check_docs.py
      - name: "Lot 9: Dockerfile extras match requirements-lock.txt"
        run: python scripts/check_lock_sync.py
      - name: "Lot 9: Dockerfile runs non-root with pre-owned cache dirs"
        run: python scripts/check_dockerfile_permissions.py
      - name: Whitespace errors
        run: git diff --check
      - name: Type check with mypy (ratcheted against .claude/mypy-baseline.txt)
        run: |
          MYPY_BASELINE=$(grep -v '^#' .claude/mypy-baseline.txt | grep -v '^$' | head -1)
          MYPY_ERRORS=$(mypy src/modular_rag/ --no-error-summary 2>&1 | grep -c "error:" || true)
          echo "mypy errors: $MYPY_ERRORS (baseline: $MYPY_BASELINE)"
          if [ "$MYPY_ERRORS" -gt "$MYPY_BASELINE" ]; then
            echo "::error::New mypy errors introduced ($MYPY_ERRORS > baseline $MYPY_BASELINE)"
            exit 1
          fi
      - name: Validate every runnable manifest (see manifests/README.md)
        env:
          QDRANT_URL: "http://localhost:6333"
          QDRANT_API_KEY: "smoke-test-key"
          AUDIT_DATABASE_URL: "postgresql://smoke-test/db"
        run: |
          python -c "
          from pathlib import Path
          from modular_rag.app.bootstrap import load_application

          for path in sorted(Path('manifests/presets').glob('*.yaml')):
              application = load_application(str(path))
              print(f'{path.name} wires cleanly (engine={application.engine_name})')
              application.close()
          "

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        # langgraph is required here, not just [v1,dev]: tests/unit/adapters/llms/
        # test_langgraph_engine.py runs LangGraphEngineAdapter.run()/.astream() for
        # real (Lot 15), which lazy-imports the real langgraph package on first call
        # (.claude/.instructions.md SS4) -- omitting it here previously meant this job
        # would fail with ModuleNotFoundError on every push, undetected because it
        # was never actually run against this workflow. Found and fixed in Lot 18.
        run: |
          pip install --upgrade pip
          pip install -e .[v1,langgraph,dev]
      - name: Run unit tests (no external services)
        run: pytest tests/unit/ -v --tb=short

  test-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[v1,dev]
      - name: Run contract conformance tests
        run: pytest tests/contract/ -v --tb=short

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-unit, test-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[v1,langgraph,dev]
      - name: Run all tests with coverage
        run: pytest tests/unit/ tests/contract/ --cov=src/modular_rag --cov-report=term-missing --cov-report=xml -v
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test-unit, test-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Build wheel
        run: |
          pip install --upgrade pip build
          python -m build --wheel
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
      - name: Clean-install smoke test
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          WHEEL_FILE=$(ls dist/*.whl)
          /tmp/smoke-venv/bin/pip install "${WHEEL_FILE}[v1]"
          /tmp/smoke-venv/bin/python -c "import modular_rag; print('import OK')"
          /tmp/smoke-venv/bin/mrag version

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Build a venv containing ONLY the shipped closure (Lot 9, round 2)"
        # A previous version of this job installed the shipped extras and
        # supply-chain tooling into the SAME environment -- constraining the
        # shipped extras closed the "vulnerable pinned version passes by
        # resolving a newer one" gap, but pip-licenses/the SBOM then still
        # inventoried that combined, tooling-contaminated environment, not
        # the image's own closure (Codex review MEDIUM-001, round 2). This
        # dedicated venv has nothing in it except exactly what the Docker
        # image itself installs, constrained the same way.
        run: |
          python -m venv shipped-venv
          shipped-venv/bin/pip install --upgrade pip
          shipped-venv/bin/pip install --no-cache-dir --no-require-hashes -c requirements-lock.txt -e ".[v1,langgraph,postgres,auth]"
      - name: "Install supply-chain tooling (unconstrained; not part of the shipped image)"
        run: |
          pip install --upgrade pip
          pip install -e ".[supply-chain]"
      - name: "Vulnerability scan: pip-audit against the lock file's own pins directly"
        # -r audits requirements-lock.txt's exact pinned versions, not
        # whatever pip-audit's own environment happens to resolve --
        # correct regardless of which venv is active, and doesn't require
        # the shipped-venv above to exist for this step specifically.
        run: pip-audit -r requirements-lock.txt
      - name: "Licence gate: scripts/check_licenses.py against the shipped-only venv"
        run: python scripts/check_licenses.py --python shipped-venv/bin/python
      - name: "Generate SBOM: CycloneDX, from the shipped-only venv"
        run: python -m cyclonedx_py environment --output-format json -o sbom.json shipped-venv/bin/python
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test-unit, test-contract]
    # security-events: write is required by github/codeql-action/upload-sarif
    # below (Codex review MEDIUM-003) to publish findings to the repo's code
    # scanning tab; contents: read matches actions/checkout's own default.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the immutable runtime image (Dockerfile, Lot 16b)
        run: docker build -t modular-rag:ci .
      - name: "Smoke test: run the image and hit /health"
        run: |
          docker run -d --name mrag-smoke -p 8000:8000 modular-rag:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/health
          docker logs mrag-smoke
          docker stop mrag-smoke
      - name: "Lot 9: vulnerability scan (Grype, via anchore/scan-action)"
        # Pinned by full commit SHA, not a mutable tag (# v7.4.0, verified live
        # against GitHub's API on 2026-08-19) -- deliberately not
        # aquasecurity/trivy-action: that action suffered a real, documented
        # supply-chain compromise in March 2026 (76 of its 77 release tags were
        # force-pushed to malicious commits stealing CI/CD secrets;
        # GHSA-69fq-xp46-6x23 / CVE-2026-33634), which is exactly the class of
        # risk a supply-chain-hardening lot should not casually reintroduce by
        # picking the more commonly-templated default without checking its own
        # history first. See docs/guides/dependency-lock.md for the sources.
        id: grype-scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: "modular-rag:ci"
          severity-cutoff: high
          fail-build: true
          output-format: sarif
      - name: "Lot 9: publish the Grype SARIF report (non-blocking MEDIUM/LOW findings, retained)"
        # Without this, the SARIF file the step above requests lives only at
        # its temporary output path and is discarded with the runner --
        # HIGH/CRITICAL still fail the job via fail-build above, but nothing
        # below that severity was ever reviewable, trended, or triaged
        # (Codex review MEDIUM-003). `if: always()` publishes it even when
        # the scan step above already failed the job on a HIGH/CRITICAL
        # finding, so that failure's own detail is retained too.
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
