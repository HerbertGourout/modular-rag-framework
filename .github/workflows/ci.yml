name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# Batch 10 (external plan; not this repo's own docs/refactoring-plan.md Lot
# sequence): integration/e2e jobs below are the expensive ones in this
# workflow (real services, real network calls) -- cancel a superseded run's
# copy of them rather than let two pushes to the same branch/PR run both to
# completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -c .github/constraints-ci.txt -e .[v1,dev]
      - name: Lint with ruff (syntax, imports, naming)
        run: ruff check . --select E,F,I,N,W,UP,B,C4 --output-format=concise
      - name: Compilation check
        run: python -m compileall -q src/modular_rag scripts examples docker
      - name: Hexagonal layering audit (strict)
        run: python scripts/check_layering.py --strict
      - name: Documentation consistency
        run: python scripts/check_docs.py
      - name: "Lot 9: Dockerfile extras match requirements-lock.txt"
        run: python scripts/check_lock_sync.py
      - name: "Lot 9: Dockerfile runs non-root with pre-owned cache dirs"
        run: python scripts/check_dockerfile_permissions.py
      - name: Whitespace errors
        run: git diff --check
      - name: Type check with mypy (ratcheted against .claude/mypy-baseline.txt)
        run: |
          MYPY_BASELINE=$(grep -v '^#' .claude/mypy-baseline.txt | grep -v '^$' | head -1)
          MYPY_ERRORS=$(mypy src/modular_rag/ --no-error-summary 2>&1 | grep -c "error:" || true)
          echo "mypy errors: $MYPY_ERRORS (baseline: $MYPY_BASELINE)"
          if [ "$MYPY_ERRORS" -gt "$MYPY_BASELINE" ]; then
            echo "::error::New mypy errors introduced ($MYPY_ERRORS > baseline $MYPY_BASELINE)"
            exit 1
          fi
      - name: Validate every runnable manifest (see manifests/README.md)
        env:
          QDRANT_URL: "http://localhost:6333"
          QDRANT_API_KEY: "smoke-test-key"
          AUDIT_DATABASE_URL: "postgresql://smoke-test/db"
        run: |
          python -c "
          from pathlib import Path
          from modular_rag.app.bootstrap import load_application

          for path in sorted(Path('manifests/presets').glob('*.yaml')):
              application = load_application(str(path))
              print(f'{path.name} wires cleanly (engine={application.engine_name})')
              application.close()
          "

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        # langgraph is required here, not just [v1,dev]: tests/unit/adapters/llms/
        # test_langgraph_engine.py runs LangGraphEngineAdapter.run()/.astream() for
        # real (Lot 15), which lazy-imports the real langgraph package on first call
        # (.claude/.instructions.md SS4) -- omitting it here previously meant this job
        # would fail with ModuleNotFoundError on every push, undetected because it
        # was never actually run against this workflow. Found and fixed in Lot 18.
        run: |
          pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -c .github/constraints-ci.txt -e .[v1,v4,langgraph,dev]
      - name: Run unit tests (no external services)
        run: pytest tests/unit/ -v --tb=short

  test-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -c .github/constraints-ci.txt -e .[v1,v4,dev]
      - name: Run contract conformance tests
        run: pytest tests/contract/ -v --tb=short

  test-integration:
    # Batch 10: previously "integration/e2e are not wired into CI" (see
    # docs/guides/validation-protocol.md's own prior claim, now corrected in
    # the same change) -- both `services:` below run for the whole job, no
    # separate teardown step needed (the runner is destroyed after the job).
    #
    # Both service images below are pinned by digest, not just a tag (Codex
    # review MEDIUM-001): `qdrant/qdrant:v1.12.4` and `postgres:16` are
    # mutable tags that can be republished, and `postgres`'s major-version
    # tag in particular is documented to advance across minor releases --
    # inconsistent with this repo's own Dockerfile digest-pinning precedent
    # (Lot 9, an unrelated earlier external-plan task) otherwise. Digests
    # resolved from Docker Hub's own v2 API on 2026-08-19, cross-checked
    # with two independent fetches each returning the identical value; the
    # same two digests are reused verbatim in every one of this repo's five
    # service declarations (this job, e2e-deterministic below, and
    # nightly.yml) so a commit never runs different binaries in different
    # jobs. Refresh procedure: query
    # `https://hub.docker.com/v2/repositories/<qdrant/qdrant|library/postgres>/tags/<tag>`
    # for the current `digest` field (same method as
    # docs/guides/dependency-lock.md's base-image refresh procedure) and
    # update all five occurrences together.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4@sha256:241edb9d7778327516ef218f8c74e1bd61b5ea42cd4f193cb8d0896199705636
        ports:
          - 6333:6333
        # No `options: --health-cmd` here -- the official image ships
        # without curl/wget (qdrant/qdrant#3491, unresolved), so Docker
        # itself has no in-image command to run as a healthcheck. The
        # "Wait for Qdrant" step below polls from the runner instead, which
        # can reach the mapped port over the network without needing
        # anything installed inside the qdrant container itself.
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -c .github/constraints-ci.txt -e .[v1,postgres,dev]
      - name: Wait for Qdrant to accept connections
        # Postgres's own --health-cmd above already gates `services:` startup
        # ordering; Qdrant has no equivalent (see the service definition's own
        # comment), so this polls its real /readyz endpoint (Kubernetes-style
        # readiness probe, added in Qdrant 1.5.0) from the runner directly.
        # Fails loudly on timeout -- never continue-on-error past this.
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/readyz; then
              echo "Qdrant ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Qdrant did not become ready within the timeout"
          exit 1
      - name: Run integration tests (real Qdrant + PostgreSQL)
        timeout-minutes: 10
        run: pytest tests/integration/ -v -m integration --tb=long -ra
      - name: Dump service container logs on failure
        if: failure()
        run: |
          echo "--- Qdrant logs ---"
          docker logs ${{ job.services.qdrant.id }} || true
          echo "--- PostgreSQL logs ---"
          docker logs ${{ job.services.postgres.id }} || true

  e2e-deterministic:
    # Batch 10: runs tests/e2e/test_secure_preset_e2e.py specifically (the
    # file, not the `-m e2e` marker across the whole tests/e2e/ directory) --
    # that marker also matches test_simple_qa_pipeline.py, which needs a real
    # LLM key and belongs in .github/workflows/nightly.yml instead, per the
    # "no LLM secrets required for the main pipeline" acceptance criterion.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4@sha256:241edb9d7778327516ef218f8c74e1bd61b5ea42cd4f193cb8d0896199705636
        ports:
          - 6333:6333
        # No `options: --health-cmd` here -- same reason as test-integration's
        # qdrant service above (the official image has no curl/wget to run
        # one); the "Wait for Qdrant" step below is the real check.
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -c .github/constraints-ci.txt -e .[v1,postgres,dev]
      - name: Wait for Qdrant to accept connections
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/readyz; then
              echo "Qdrant ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Qdrant did not become ready within the timeout"
          exit 1
      - name: Run the deterministic secure-preset e2e scenario
        # test_secure_preset_e2e.py's own `_require_services` fixture SKIPS
        # (not fails) every test in the module if either service looks
        # unreachable to it -- a real defect here (a misconfigured DSN/URL,
        # a service that started but isn't actually usable) could otherwise
        # produce an all-skipped run that still exits 0. The Qdrant/Postgres
        # waits above make that unlikely, but the explicit grep below is the
        # actual guard against a silent, still-green false pass (Batch 10's
        # own "no masked failures" requirement, applied to skips too, not
        # only to continue-on-error).
        timeout-minutes: 10
        run: |
          set -o pipefail
          pytest tests/e2e/test_secure_preset_e2e.py -v -m e2e --tb=long -ra 2>&1 | tee pytest-e2e.log
          if grep -q "SKIPPED" pytest-e2e.log; then
            echo "::error::e2e tests were skipped -- Qdrant/PostgreSQL were not genuinely reachable despite the preflight wait"
            exit 1
          fi
      - name: Dump service container logs on failure
        if: failure()
        run: |
          echo "--- Qdrant logs ---"
          docker logs ${{ job.services.qdrant.id }} || true
          echo "--- PostgreSQL logs ---"
          docker logs ${{ job.services.postgres.id }} || true

  benchmark-gate:
    # Batch 13 (external plan — "Offline benchmark"; not this repo's own
    # docs/refactoring-plan.md Lot numbering, which already used "Lot 13"
    # for an unrelated, already-completed metric-vocabulary fix). Reuses the
    # same Qdrant service image/digest as test-integration/e2e-deterministic
    # above -- not a new CI service -- and needs no LLM key: the benchmark's
    # own manifest (src/modular_rag/eval/manifests/benchmark-deterministic.yaml)
    # wires the deterministic embedder/generator, same as the e2e-deterministic
    # job's manifest.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4@sha256:241edb9d7778327516ef218f8c74e1bd61b5ea42cd4f193cb8d0896199705636
        ports:
          - 6333:6333
        # No `options: --health-cmd` here -- same reason as the other two
        # Qdrant services in this workflow (the official image has no
        # curl/wget to run one); the "Wait for Qdrant" step below is the
        # real check.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -c .github/constraints-ci.txt -e .[v1,dev]
      - name: Wait for Qdrant to accept connections
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/readyz; then
              echo "Qdrant ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Qdrant did not become ready within the timeout"
          exit 1
      - name: Run the offline benchmark quality gate (blocking)
        run: python scripts/run_benchmark.py --enforce
      - name: Upload the benchmark report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: |
            src/modular_rag/eval/reports/latest.json
            src/modular_rag/eval/reports/latest.md

  compose-smoke:
    # Batch 10: "a container smoke test that goes beyond the /health
    # endpoint." Deliberately not folded into container-build below (which
    # stays a fast, single-container "does the image even boot" signal) --
    # this job exercises the full api+qdrant+postgres+migrate compose.yaml
    # stack via scripts/smoke_test_compose.py (written in an earlier,
    # unrelated change but never executed anywhere until this job exists),
    # proving /ready's per-dependency roles and a real `mrag ingest` actually
    # work, not just that the process starts and answers /health. No LLM key
    # is available in this job on purpose -- smoke_test_compose.py already
    # skips its LLM-gated assertions (the `generator` role, `mrag ask`) when
    # OPENAI_API_KEY is unset, so this job verifies only the non-LLM path,
    # matching "no LLM secrets required for the main pipeline."
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test-unit, test-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install the smoke test script's own runtime dependency
        run: pip install --upgrade pip httpx
      - name: Run the Compose stack smoke test
        timeout-minutes: 12
        run: python scripts/smoke_test_compose.py

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-unit, test-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -c .github/constraints-ci.txt -e .[v1,v4,langgraph,dev]
      - name: Run all tests with coverage
        run: pytest tests/unit/ tests/contract/ --cov=src/modular_rag --cov-report=term-missing --cov-report=xml -v
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test-unit, test-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Build wheel
        run: |
          pip install --upgrade pip build
          python -m build --wheel
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
      - name: Clean-install smoke test
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          WHEEL_FILE=$(ls dist/*.whl)
          /tmp/smoke-venv/bin/pip install --extra-index-url https://download.pytorch.org/whl/cpu -c .github/constraints-ci.txt "${WHEEL_FILE}[v1]"
          /tmp/smoke-venv/bin/python -c "import modular_rag; print('import OK')"
          /tmp/smoke-venv/bin/mrag version

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Build a venv containing ONLY the shipped closure (Lot 9, round 2)"
        # A previous version of this job installed the shipped extras and
        # supply-chain tooling into the SAME environment -- constraining the
        # shipped extras closed the "vulnerable pinned version passes by
        # resolving a newer one" gap, but pip-licenses/the SBOM then still
        # inventoried that combined, tooling-contaminated environment, not
        # the image's own closure (Codex review MEDIUM-001, round 2). This
        # dedicated venv has nothing in it except exactly what the Docker
        # image itself installs, constrained the same way.
        run: |
          python -m venv shipped-venv
          shipped-venv/bin/pip install --upgrade pip
          shipped-venv/bin/pip install --no-cache-dir --no-require-hashes -c requirements-lock.txt -e ".[v1,langgraph,postgres,auth]"
      - name: "Install supply-chain tooling (unconstrained; not part of the shipped image)"
        run: |
          pip install --upgrade pip
          pip install -e ".[supply-chain]"
      - name: "Vulnerability scan: pip-audit against the lock file's own pins directly"
        # -r audits requirements-lock.txt's exact pinned versions, not
        # whatever pip-audit's own environment happens to resolve --
        # correct regardless of which venv is active, and doesn't require
        # the shipped-venv above to exist for this step specifically.
        run: pip-audit -r requirements-lock.txt
      - name: "Licence gate: scripts/check_licenses.py against the shipped-only venv"
        run: python scripts/check_licenses.py --python shipped-venv/bin/python
      - name: "Generate SBOM: CycloneDX, from the shipped-only venv"
        run: python -m cyclonedx_py environment --output-format json -o sbom.json shipped-venv/bin/python
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test-unit, test-contract]
    # security-events: write is required by github/codeql-action/upload-sarif
    # below (Codex review MEDIUM-003) to publish findings to the repo's code
    # scanning tab; contents: read matches actions/checkout's own default.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the immutable runtime image (Dockerfile, Lot 16b)
        run: docker build -t modular-rag:ci .
      - name: "Smoke test: run the image and hit /health"
        run: |
          docker run -d --name mrag-smoke -p 8000:8000 modular-rag:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/health
          docker logs mrag-smoke
          docker stop mrag-smoke
      - name: "Lot 9: vulnerability scan (Grype, via anchore/scan-action)"
        # Pinned by full commit SHA, not a mutable tag (# v7.4.0, verified live
        # against GitHub's API on 2026-08-19) -- deliberately not
        # aquasecurity/trivy-action: that action suffered a real, documented
        # supply-chain compromise in March 2026 (76 of its 77 release tags were
        # force-pushed to malicious commits stealing CI/CD secrets;
        # GHSA-69fq-xp46-6x23 / CVE-2026-33634), which is exactly the class of
        # risk a supply-chain-hardening lot should not casually reintroduce by
        # picking the more commonly-templated default without checking its own
        # history first. See docs/guides/dependency-lock.md for the sources.
        id: grype-scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: "modular-rag:ci"
          severity-cutoff: high
          fail-build: true
          output-format: sarif
      - name: "Lot 9: publish the Grype SARIF report (non-blocking MEDIUM/LOW findings, retained)"
        # Without this, the SARIF file the step above requests lives only at
        # its temporary output path and is discarded with the runner --
        # HIGH/CRITICAL still fail the job via fail-build above, but nothing
        # below that severity was ever reviewable, trended, or triaged
        # (Codex review MEDIUM-003). `if: always()` publishes it even when
        # the scan step above already failed the job on a HIGH/CRITICAL
        # finding, so that failure's own detail is retained too.
        if: always() && steps.grype-scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
